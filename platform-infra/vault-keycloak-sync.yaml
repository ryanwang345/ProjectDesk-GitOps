# Syncs Keycloak & Headlamp oauth2-proxy secrets from HashiCorp Vault via External Secrets Operator.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-secrets
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: keycloak-secrets
    creationPolicy: Owner
  data:
    - secretKey: admin-password
      remoteRef:
        key: keycloak
        property: admin-password
    - secretKey: db-password
      remoteRef:
        key: keycloak
        property: db-password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: headlamp-oidc-secret
  namespace: headlamp
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: headlamp-oidc-secret
    creationPolicy: Owner
    template:
      data:
        OAUTH2_PROXY_CLIENT_ID: "headlamp"
        OAUTH2_PROXY_CLIENT_SECRET: "{{ .clientSecret }}"
        OAUTH2_PROXY_COOKIE_SECRET: "{{ .cookieSecret }}"
  data:
    - secretKey: clientSecret
      remoteRef:
        key: headlamp-oidc
        property: client-secret
    - secretKey: cookieSecret
      remoteRef:
        key: headlamp-oidc
        property: cookie-secret
