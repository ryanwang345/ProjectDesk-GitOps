apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://kubernetes-sigs.github.io/headlamp/
    chart: headlamp
    targetRevision: 0.46.0
    helm:
      # Generate login token on any new cluster (no manual RBAC YAML needed):
      #   kubectl create token headlamp -n headlamp --duration=8760h
      valuesObject:
        serviceAccount:
          create: true
          name: headlamp
        clusterRoleBinding:
          create: true
          clusterRoleName: cluster-admin
        config:
          unsafeUseServiceAccountToken: true
        volumes:
          - name: keycloak-logout-plugin
            configMap:
              name: headlamp-keycloak-logout
        volumeMounts:
          - name: keycloak-logout-plugin
            mountPath: /headlamp/plugins/keycloak-logout
            readOnly: true
        ingress:
          enabled: true
          ingressClassName: nginx
          annotations:
            nginx.ingress.kubernetes.io/auth-url: "http://oauth2-proxy.headlamp.svc.cluster.local:4180/oauth2/auth"
            nginx.ingress.kubernetes.io/auth-signin: "https://$host/oauth2/start?rd=$escaped_request_uri"
            nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
          hosts:
            - host: k8s.ryanwang.dev
              paths:
                - path: /
                  type: Prefix
  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
