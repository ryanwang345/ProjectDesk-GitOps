# Keycloak (Identity & OIDC Provider) running in Kubernetes, managed by ArgoCD.
# Uses codecentric/keycloakx Helm chart (same structure as jenkins.yaml / vault.yaml).
# Secrets are synced from HashiCorp Vault via platform-infra/vault-keycloak-sync.yaml.
# UI: https://keycloak.ryanwang.dev
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://codecentric.github.io/helm-charts
    chart: keycloakx
    targetRevision: 7.4.0
    helm:
      valuesObject:
        replicas: 1
        command:
          - "/opt/keycloak/bin/kc.sh"
          - "start"
        database:
          vendor: dev-file
        http:
          relativePath: "/"
        proxy:
          enabled: true
          mode: forwarded
          http:
            enabled: true
        health:
          enabled: true
        extraEnv: |
          - name: KC_BOOTSTRAP_ADMIN_USERNAME
            value: admin
          - name: KC_BOOTSTRAP_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: keycloak-secrets
                key: admin-password
          - name: KC_HOSTNAME
            value: https://keycloak.ryanwang.dev
        volumeClaimTemplates: |
          - metadata:
              name: keycloak-data
            spec:
              accessModes:
                - ReadWriteOnce
              storageClassName: local-path
              resources:
                requests:
                  storage: 2Gi
        extraVolumeMounts: |
          - name: keycloak-data
            mountPath: /opt/keycloak/data
        ingress:
          enabled: true
          ingressClassName: nginx
          annotations:
            nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
            nginx.ingress.kubernetes.io/proxy-busy-buffers-size: "24k"
          rules:
            - host: keycloak.ryanwang.dev
              paths:
                - path: /
                  pathType: Prefix
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
