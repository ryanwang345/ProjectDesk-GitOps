# Connects External Secrets Operator -> HashiCorp Vault and syncs Jenkins admin password.
# Apply this AFTER `vault` and `external-secrets` Applications are healthy and Vault is initialized/unsealed.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          serviceAccountRef:
            name: "external-secrets"
            namespace: "external-secrets"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jenkins-admin-secret
  namespace: jenkins
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: jenkins-admin-secret
    creationPolicy: Owner
    template:
      data:
        jenkins-admin-user: "admin"
        jenkins-admin-password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: jenkins
        property: jenkins-admin-password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jenkins-ci-credentials
  namespace: jenkins
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: jenkins-ci-credentials
    creationPolicy: Owner
  data:
    - secretKey: dockerhub-user
      remoteRef:
        key: jenkins-ci
        property: dockerhub-user
    - secretKey: dockerhub-token
      remoteRef:
        key: jenkins-ci
        property: dockerhub-token
    - secretKey: github-token
      remoteRef:
        key: jenkins-ci
        property: github-token
