# Lightweight Vault Auto-Unseal CronJob for homelab / OrbStack restarts.
# - Reads keys from in-cluster Secret `vault-unseal-keys` (never stored in Git)
# - Checks Vault HTTP `/v1/sys/seal-status` every 2 minutes; if sealed, unseals automatically.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-auto-unseal
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 30
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: unseal
              image: curlimages/curl:8.10.1
              imagePullPolicy: IfNotPresent
              env:
                - name: UNSEAL_KEY_1
                  valueFrom:
                    secretKeyRef:
                      name: vault-unseal-keys
                      key: key1
                - name: UNSEAL_KEY_2
                  valueFrom:
                    secretKeyRef:
                      name: vault-unseal-keys
                      key: key2
                - name: UNSEAL_KEY_3
                  valueFrom:
                    secretKeyRef:
                      name: vault-unseal-keys
                      key: key3
              command:
                - /bin/sh
                - -ec
                - |
                  VAULT_URL="http://vault.vault.svc.cluster.local:8200"
                  STATUS=$(curl -sf "${VAULT_URL}/v1/sys/seal-status" || true)
                  if [ -z "$STATUS" ]; then
                    echo "[vault-auto-unseal] Vault not reachable yet; skipping."
                    exit 0
                  fi
                  if echo "$STATUS" | grep -q '"sealed":false'; then
                    echo "[vault-auto-unseal] Vault is already unsealed."
                    exit 0
                  fi
                  echo "[vault-auto-unseal] Vault is sealed; unsealing..."
                  for KEY in "$UNSEAL_KEY_1" "$UNSEAL_KEY_2" "$UNSEAL_KEY_3"; do
                    curl -sf -X PUT -H "Content-Type: application/json" \
                      -d "{\"key\":\"${KEY}\"}" \
                      "${VAULT_URL}/v1/sys/unseal" >/dev/null
                  done
                  echo "[vault-auto-unseal] Vault unsealed successfully."
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
