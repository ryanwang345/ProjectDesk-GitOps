apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: project-desk-e2e-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ryanwang345/ProjectDesk.git
    targetRevision: main
    path: apps/e2e/chart
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: projectdesk-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
