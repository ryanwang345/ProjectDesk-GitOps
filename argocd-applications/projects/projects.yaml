# Applications are scoped to a project so each one can only pull from known
# sources and deploy into its own namespaces. The bootstrap Applications stay
# in "default" because they are applied by hand before these projects exist.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: projectdesk
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: ProjectDesk application environments
  sourceRepos:
    - https://github.com/ryanwang345/ProjectDesk-GitOps.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: projectdesk-staging
    - server: https://kubernetes.default.svc
      namespace: projectdesk-prod
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceBlacklist:
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: Shared platform services (ingress, secrets, identity, CI, dashboards)
  sourceRepos:
    - https://github.com/ryanwang345/ProjectDesk-GitOps.git
    - https://kubernetes.github.io/ingress-nginx
    - https://charts.jenkins.io
    - https://codecentric.github.io/helm-charts
    - https://helm.releases.hashicorp.com
    - https://charts.external-secrets.io
    - https://kubernetes-sigs.github.io/headlamp/
  destinations:
    - server: https://kubernetes.default.svc
      namespace: ingress-nginx
    - server: https://kubernetes.default.svc
      namespace: jenkins
    - server: https://kubernetes.default.svc
      namespace: keycloak
    - server: https://kubernetes.default.svc
      namespace: vault
    - server: https://kubernetes.default.svc
      namespace: external-secrets
    - server: https://kubernetes.default.svc
      namespace: headlamp
  # Operator charts install CRDs, webhooks and cluster RBAC.
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
