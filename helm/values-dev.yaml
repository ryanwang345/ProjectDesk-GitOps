# Development environment overrides for ProjectDesk
environment: dev

postgres:
  storage: 1Gi
  backup:
    enabled: false

api:
  image: docker.io/rwang345/project-desk-api
  tag: "19"
  pullPolicy: IfNotPresent
  replicaCount: 1

web:
  image: docker.io/rwang345/project-desk-web
  tag: "19"
  pullPolicy: IfNotPresent
  replicaCount: 1

ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  host: desk-dev.ryanwang.dev
  additionalHost: desk-dev.k8s.local
  extraHosts: []
  tlsSecretName: project-desk-dev-tls
