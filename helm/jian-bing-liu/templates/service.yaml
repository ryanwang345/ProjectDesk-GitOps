apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "jian-bing-liu.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "jian-bing-liu.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
