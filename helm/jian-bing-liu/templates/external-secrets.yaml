{{- with .Values.web.reviews }}
{{- if and (not .existingSecret) .externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jian-bing-liu-reviews
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "jian-bing-liu.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ .externalSecret.refreshInterval }}
  secretStoreRef:
    {{- toYaml .externalSecret.secretStoreRef | nindent 4 }}
  target:
    name: jian-bing-liu-reviews
    creationPolicy: Owner
  data:
    - secretKey: GOOGLE_PLACES_API_KEY
      remoteRef:
        key: {{ required "web.reviews.externalSecret.remoteKey is required" .externalSecret.remoteKey }}
        property: {{ .externalSecret.property | default "api-key" }}
{{- end }}
{{- end }}
