environment: dev

web:
  image: docker.io/rwang345/jian-bing-liu
  tag: "1"
  pullPolicy: IfNotPresent
  port: 3000
  replicaCount: 1
  siteUrl: https://jianbingliu.uk
  reviews:
    # Credential sources, in order of precedence:
    #   1. existingSecret: a Kubernetes Secret you manage manually.
    #   2. externalSecret.enabled: External Secrets Operator syncs Vault into
    #      the "jian-bing-liu-reviews" Secret (key: GOOGLE_PLACES_API_KEY).
    existingSecret: ""
    externalSecret:
      enabled: false
      refreshInterval: 1h
      secretStoreRef:
        name: vault-backend
        kind: ClusterSecretStore
      # Vault KV v2 path (under mount "secret/") holding the "api-key" property.
      remoteKey: jian-bing-liu/google-places
      property: api-key
    placeId: ""
    feedUrl: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

imagePullSecrets: []

# Created only when web.replicaCount > 1.
podDisruptionBudget:
  maxUnavailable: 1

networkPolicy:
  enabled: true

ingress:
  enabled: true
  className: nginx
  # TLS terminates at Cloudflare and cloudflared forwards plain HTTP to
  # ingress-nginx, so disable nginx's SSL redirect to avoid redirect loops.
  # Enforce HTTPS via Cloudflare "Always Use HTTPS" instead.
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
  host: jianbingliu.uk
  additionalHost: www.jianbingliu.uk
  extraHosts:
    - jianbingliu.k8s.local
  tls:
    enabled: false
    secretName: jian-bing-liu-tls
