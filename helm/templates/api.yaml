apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: {{ .Release.Namespace }}
  labels:
    app: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.api.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.api.image }}:{{ .Values.api.tag }}"
          imagePullPolicy: {{ .Values.api.pullPolicy }}
          securityContext:
            {{- toYaml .Values.api.securityContext | nindent 12 }}
          ports:
            - containerPort: {{ .Values.api.port }}
          env:
            - name: APP_VERSION
              value: {{ .Values.api.tag | default "dev" | quote }}
            - name: PORT
              value: {{ .Values.api.port | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "project-desk.postgresSecretName" . }}
                  key: DATABASE_URL
            {{- if include "project-desk.aiSecretEnabled" . }}
            - name: PROJECT_DESK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "project-desk.aiSecretName" . }}
                  key: PROJECT_DESK_SECRET_KEY
            {{- end }}
            {{- if include "project-desk.aiAdminTokenEnabled" . }}
            - name: PROJECT_DESK_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "project-desk.aiSecretName" . }}
                  key: PROJECT_DESK_ADMIN_TOKEN
                  optional: true
            {{- end }}
            - name: PROJECT_DESK_REPOS
              value: {{ .Values.api.ai.reposPath | quote }}
            - name: PROJECT_DESK_RUNNER
              value: {{ .Values.api.ai.runner | quote }}
            - name: PROJECT_DESK_WORKER_CONCURRENCY
              value: {{ .Values.api.ai.workerConcurrency | quote }}
            - name: PROJECT_DESK_MAX_JOBS_PER_CYCLE
              value: {{ .Values.api.ai.maxJobsPerCycle | quote }}
            - name: PROJECT_DESK_MAX_REPAIRS
              value: {{ .Values.api.ai.maxRepairs | quote }}
            - name: PROJECT_DESK_TEST_TIMEOUT_SECONDS
              value: {{ .Values.api.ai.testTimeoutSeconds | quote }}
          # /api/readyz also checks that migrations finished, so traffic
          # waits for the schema; /api/healthz stays the lightweight check.
          readinessProbe:
            httpGet:
              path: /api/readyz
              port: {{ .Values.api.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: {{ .Values.api.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      # The worker stops claiming jobs on SIGTERM and finishes in-flight
      # work; anything cut off is requeued by the stale sweep.
      terminationGracePeriodSeconds: 45
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: api
  ports:
    - port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}
