{{- if and (not .Values.api.ai.existingSecret) (or .Values.api.ai.secretKey .Values.api.ai.adminToken) }}
# Created only when values carry the literals. For real environments set
# api.ai.existingSecret to a Secret managed outside the chart instead.
apiVersion: v1
kind: Secret
metadata:
  name: project-desk-ai
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  {{- if .Values.api.ai.secretKey }}
  PROJECT_DESK_SECRET_KEY: {{ .Values.api.ai.secretKey | quote }}
  {{- end }}
  {{- if .Values.api.ai.adminToken }}
  PROJECT_DESK_ADMIN_TOKEN: {{ .Values.api.ai.adminToken | quote }}
  {{- end }}
{{- end }}
