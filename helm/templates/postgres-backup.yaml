{{- if .Values.postgres.backup.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: project-desk-postgres-backup
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: project-desk
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.postgres.backup.storageClassName }}
  storageClassName: {{ .Values.postgres.backup.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgres.backup.storage }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: project-desk-postgres-backup
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: project-desk
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  schedule: {{ .Values.postgres.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: project-desk
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          restartPolicy: OnFailure
          securityContext:
            fsGroup: {{ .Values.postgres.fsGroup }}
          containers:
            - name: backup
              image: {{ .Values.postgres.image }}
              imagePullPolicy: {{ .Values.postgres.pullPolicy }}
              env:
                - name: PGHOST
                  value: postgres
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: project-desk-postgres
                      key: POSTGRES_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: project-desk-postgres
                      key: POSTGRES_PASSWORD
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: project-desk-postgres
                      key: POSTGRES_DB
              command:
                - /bin/sh
                - -ec
                - |
                  stamp=$(date -u +%Y%m%dT%H%M%SZ)
                  pg_dump --clean --if-exists --no-owner -f "/backup/projectdesk-${stamp}.sql"
                  ls -1t /backup/projectdesk-*.sql | awk 'NR>{{ .Values.postgres.backup.keep }}' | while IFS= read -r old; do
                    rm -f "$old"
                  done
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: project-desk-postgres-backup
{{- end }}
