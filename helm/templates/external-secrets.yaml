{{- with .Values.postgres }}
{{- if and (not .existingSecret) .externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: project-desk-postgres
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: project-desk
    app.kubernetes.io/instance: {{ $.Release.Name }}
spec:
  refreshInterval: {{ .externalSecret.refreshInterval }}
  secretStoreRef:
    {{- toYaml .externalSecret.secretStoreRef | nindent 4 }}
  target:
    name: project-desk-postgres
    creationPolicy: Owner
    template:
      data:
        POSTGRES_USER: {{ `"{{ .username }}"` }}
        POSTGRES_PASSWORD: {{ `"{{ .password }}"` }}
        POSTGRES_DB: {{ .database | quote }}
        DATABASE_URL: '{{ `postgres://{{ .username }}:{{ .password | urlquery | replace "+" "%20" }}@postgres:5432/` }}{{ .database }}?sslmode=disable'
  data:
    - secretKey: username
      remoteRef:
        key: {{ required "postgres.externalSecret.remoteKey is required" .externalSecret.remoteKey }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .externalSecret.remoteKey }}
        property: password
---
{{- end }}
{{- end }}
{{- with .Values.api.ai }}
{{- if and (not .existingSecret) .externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: project-desk-ai
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: project-desk
    app.kubernetes.io/instance: {{ $.Release.Name }}
spec:
  refreshInterval: {{ .externalSecret.refreshInterval }}
  secretStoreRef:
    {{- toYaml .externalSecret.secretStoreRef | nindent 4 }}
  target:
    name: project-desk-ai
    creationPolicy: Owner
  data:
    - secretKey: PROJECT_DESK_SECRET_KEY
      remoteRef:
        key: {{ required "api.ai.externalSecret.remoteKey is required" .externalSecret.remoteKey }}
        property: secret-key
    {{- if .externalSecret.syncAdminToken }}
    - secretKey: PROJECT_DESK_ADMIN_TOKEN
      remoteRef:
        key: {{ .externalSecret.remoteKey }}
        property: admin-token
    {{- end }}
{{- end }}
{{- end }}
