# Production environment overrides for ProjectDesk
environment: prod

postgres:
  storage: 5Gi
  backup:
    enabled: false

api:
  image: docker.io/rwang345/project-desk-api
  tag: "90"
  pullPolicy: IfNotPresent
  replicaCount: 1

web:
  image: docker.io/rwang345/project-desk-web
  tag: "90"
  pullPolicy: IfNotPresent
  replicaCount: 1

ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  host: www.ryanwang.dev
  additionalHost: ryanwang.dev
  extraHosts:
    - desk.ryanwang.dev
  tlsSecretName: project-desk-prod-tls
