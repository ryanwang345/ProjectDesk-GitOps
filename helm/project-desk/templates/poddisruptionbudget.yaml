{{- range $name := list "api" "web" }}
{{- if gt (int (index $.Values $name).replicaCount) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  maxUnavailable: {{ $.Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      app: {{ $name }}
{{- end }}
{{- end }}
