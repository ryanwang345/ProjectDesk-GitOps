# Staging environment overrides for ProjectDesk
environment: staging

postgres:
  storage: 2Gi
  backup:
    enabled: false

api:
  image: docker.io/rwang345/project-desk-api
  tag: "89"
  pullPolicy: IfNotPresent
  replicaCount: 2

web:
  image: docker.io/rwang345/project-desk-web
  tag: "89"
  pullPolicy: IfNotPresent
  replicaCount: 2

ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  host: desk-staging.ryanwang.dev
  additionalHost: desk-staging.k8s.local
  extraHosts: []
  tlsSecretName: project-desk-staging-tls
