apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: project-desk
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ryanwang345/ProjectDesk-GitOps.git
    targetRevision: main
    path: helm
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: rwang
  # Image updates are GitOps-driven: Jenkins pushes a new immutable tag to
  # deploy/helm/values.yaml on main, ArgoCD detects the commit and
  # auto-syncs, and Kubernetes performs a rolling update of api/web.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
